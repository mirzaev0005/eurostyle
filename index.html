<script>
    async function loadProducts() {
        const list = document.getElementById('product-list');
        try {
            const res = await fetch(`http://localhost:8080/api/products`);
            const products = await res.json();
            list.innerHTML = "";

            products.forEach(p => {
                // O'lchamlarni chiroyli qilib chiqarish
                const sizes = p.sizes ? p.sizes.split(',') : [];
                let sizesHtml = sizes.map(s => `<span style="display:inline-block; border:1px solid #ddd; padding:2px 8px; margin:2px; border-radius:4px; font-size:12px; background:#f9f9f9;">${s.trim()}</span>`).join('');

                list.innerHTML += `
                    <div class="product-card" style="background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:15px; padding:10px;">
                        <img src="${p.img}" style="width:100%; border-radius:8px;">
                        <div style="padding:10px 0;">
                            <h3 style="font-size:16px;">${p.name}</h3>
                            <div style="margin:8px 0;">${sizesHtml}</div>
                            <p style="color:#007aff; font-weight:bold;">${p.price} so'm</p>
                            <button onclick="tg.sendData('Buyurtma: ${p.name}')" style="width:100%; background:#007aff; color:#fff; border:none; padding:10px; border-radius:8px; margin-top:10px;">Sotib olish</button>
                        </div>
                    </div>
                `;
            });
        } catch (e) { console.error(e); }
    }
    window.onload = loadProducts;
</script>
