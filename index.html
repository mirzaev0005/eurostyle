<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .product-card { background: #fff; border-radius: 20px; padding: 15px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; border-radius: 15px; height: 250px; object-fit: cover; }
        .size-tag { display: inline-block; background: #f3f4f6; color: #1f2937; padding: 5px 12px; margin: 4px; border-radius: 8px; font-size: 13px; font-weight: 600; }
        .price { color: #007aff; font-size: 22px; font-weight: bold; margin: 15px 0; }
        .btn { width: 100%; background: #007aff; color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">👔 Euro Style Katalog</h2>
    <div id="product-list"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // NGROK LINKINGIZNI SHU YERGA QO'YING
        const SERVER_URL = "https://undepicted-rosina-deferential.ngrok-free.app"; 

        async function loadProducts() {
            const list = document.getElementById('product-list');
            try {
                const res = await fetch(`${SERVER_URL}/api/products`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                const products = await res.json();
                list.innerHTML = "";

                if (products.length === 0) {
                    list.innerHTML = "<p style='text-align:center;'>Hozircha mahsulotlar yo'q.</p>";
                    return;
                }

                products.forEach(p => {
                    const sizes = p.sizes ? p.sizes.split(',').map(s => `<span class="size-tag">${s.trim()}</span>`).join('') : '';
                    list.innerHTML += `
                        <div class="product-card">
                            <img src="${p.img}">
                            <h3>${p.name}</h3>
                            <div style="margin: 10px 0;">${sizes}</div>
                            <p class="price">${p.price} so'm</p>
                            <button class="btn" onclick="tg.sendData('${p.name} - ${p.price}')">Sotib olish</button>
                        </div>
                    `;
                });
            } catch (e) {
                list.innerHTML = "<p style='text-align:center; color:red;'>⚠️ Katalog yuklanmadi. Ngrok linkini GitHub-da yangilang!</p>";
            }
        }
        window.onload = loadProducts;
    </script>
</body>
</html>
