<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #000; --card: #141414; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; user-select: none; }
        header { padding: 15px; text-align: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; background: #000; z-index: 10; }
        .container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--card); border-radius: 10px; border: 1px solid #222; overflow: hidden; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-body { padding: 10px; text-align: center; }
        .price { color: var(--gold); font-weight: bold; display: block; margin: 5px 0; }
        .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin: 10px 0; }
        .size-btn { background: #222; border: 1px solid #444; color: #fff; font-size: 9px; padding: 5px 0; border-radius: 3px; }
        .size-btn.active { background: var(--gold); color: #000; }
        .buy-btn { width: 100%; background: var(--gold); border: none; padding: 10px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        
        #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: #1a1a1a; padding: 20px; border-radius: 15px; width: 80%; text-align: center; border: 1px solid var(--gold); }
        input { width: 90%; padding: 10px; margin: 15px 0; background: #000; border: 1px solid var(--gold); color: #fff; border-radius: 5px; font-size: 18px; }
    </style>
</head>
<body>

<header><h3>EURO STYLE</h3></header>
<div class="container" id="product-container">
    <p style="text-align: center; grid-column: span 2;">Yuklanmoqda...</p>
</div>

<div id="modal">
    <div class="modal-box">
        <h3>Tasdiqlash</h3>
        <p id="summary"></p>
        <input type="tel" id="phone" value="+998">
        <button class="buy-btn" onclick="sendOrder()">YUBORISH</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let current = {};

    // API orqali mahsulotlarni olish (O'zingizni loginigizni qo'ying)
    async function loadProducts() {
        try {
            const res = await fetch('https://mirzaev0005.pythonanywhere.com/get_products');
            const data = await res.json();
            const container = document.getElementById('product-container');
            container.innerHTML = '';

            data.forEach((p, i) => {
                container.innerHTML += `
                    <div class="card">
                        <img src="${p.image}" onerror="this.src='923.jpg'">
                        <div class="card-body">
                            <div style="font-size: 12px; height: 30px;">${p.name}</div>
                            <span class="price">${p.price} so'm</span>
                            <div class="size-grid" id="size-${i}">
                                <button class="size-btn" onclick="setS(this)">S</button>
                                <button class="size-btn" onclick="setS(this)">M</button>
                                <button class="size-btn active" onclick="setS(this)">L</button>
                                <button class="size-btn" onclick="setS(this)">XL</button>
                                <button class="size-btn" onclick="setS(this)">2XL</button>
                                <button class="size-btn" onclick="setS(this)">3XL</button>
                                <button class="size-btn" onclick="setS(this)">4XL</button>
                                <button class="size-btn" onclick="setS(this)">5XL</button>
                            </div>
                            <button class="buy-btn" onclick="preOrder('${p.name}', '${p.price}', 'size-${i}')">SOTIB OLISH</button>
                        </div>
                    </div>`;
            });
        } catch (e) { document.getElementById('product-container').innerHTML = "Xatolik yuz berdi."; }
    }

    function setS(btn) {
        btn.parentElement.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function preOrder(name, price, sid) {
        let size = document.querySelector(`#${sid} .active`).innerText;
        current = { name, price, size };
        document.getElementById('summary').innerText = name + " (" + size + ")";
        document.getElementById('modal').style.display = 'flex';
    }

    function sendOrder() {
        let ph = document.getElementById('phone').value;
        if(ph.length < 9) return alert("Raqam xato");
        tg.sendData(`👕 ${current.name}\n📏 O'lcham: ${current.size}\n💰 Narx: ${current.price}\n📞 Tel: ${ph}`);
        tg.close();
    }

    loadProducts();
</script>
</body>
</html>
