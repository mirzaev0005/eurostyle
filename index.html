<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style Katalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 0; }
        header { width: 100%; background: linear-gradient(135deg, #d4af37, #f2d06b); color: #000; padding: 15px 0; text-align: center; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        
        .promo-banner { background: #1a1a1a; padding: 10px; text-align: center; border-bottom: 1px solid #d4af37; font-size: 12px; color: #d4af37; }

        .container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .card { background: #111; border: 1px solid #333; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
        .card:active { border-color: #d4af37; transform: scale(0.98); }
        
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-info { padding: 10px; text-align: center; }
        .card h3 { font-size: 14px; margin: 5px 0; color: #fff; }
        .price { font-size: 15px; color: #d4af37; font-weight: bold; margin-bottom: 8px; display: block; }
        
        .btn-order { background: #d4af37; color: #000; border: none; padding: 8px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .footer-info { padding: 20px; text-align: center; font-size: 11px; color: #666; }
    </style>
</head>
<body>
    <header>EURO STYLE 👔</header>
    
    <div class="promo-banner">
        🌟 XS dan 5XL gacha barcha o'lchamlar mavjud!
    </div>

    <div class="container">
        <div class="card">
            <img src="https://raw.githubusercontent.com/mirzaev0005/eurostyle/main/923.jpg" alt="Demiks Polo">
            <div class="card-info">
                <h3>Demiks Premium (T.Ko'k)</h3>
                <span class="price">120 000 so'm</span>
                <button class="btn-order" onclick="order('Demiks Polo - T.Ko\'k, 120 000 sum')">Tanlash</button>
            </div>
        </div>

        <div class="card">
            <img src="https://raw.githubusercontent.com/mirzaev0005/eurostyle/main/925.jpg" alt="Demiks Polo">
            <div class="card-info">
                <h3>Demiks Premium (Oq)</h3>
                <span class="price">120 000 so'm</span>
                <button class="btn-order" onclick="order('Demiks Polo - Oq, 120 000 sum')">Tanlash</button>
            </div>
        </div>

        <div class="card">
            <img src="https://raw.githubusercontent.com/mirzaev0005/eurostyle/main/927.jpg" alt="Demiks Polo">
            <div class="card-info">
                <h3>Demiks Premium (Yashil)</h3>
                <span class="price">120 000 so'm</span>
                <button class="btn-order" onclick="order('Demiks Polo - Yashil, 120 000 sum')">Tanlash</button>
            </div>
        </div>

        <div class="card">
            <img src="https://raw.githubusercontent.com/mirzaev0005/eurostyle/main/932.jpg" alt="Demiks Polo">
            <div class="card-info">
                <h3>Demiks Premium (Kulrang)</h3>
                <span class="price">120 000 so'm</span>
                <button class="btn-order" onclick="order('Demiks Polo - Kulrang, 120 000 sum')">Tanlash</button>
            </div>
        </div>
    </div>

    <div class="footer-info">
        📍 Mumtoz bozori, 3-Blok, 126-do'kon<br>
        O'zbekiston bo'ylab yetkazib berish mavjud.
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.textColor = "#000000";
        tg.MainButton.color = "#d4af37";

        function order(product) {
            // Telegram botga ma'lumot yuborish
            tg.sendData("Buyurtma: " + product);
        }
    </script>
</body>
</html>
