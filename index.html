<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 15px; margin: 0; }
        .product-card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; border-radius: 10px; height: 180px; object-fit: cover; }
        .price { color: #2ecc71; font-size: 1.2em; font-weight: bold; margin: 10px 0; }
        .buy-btn { width: 100%; background: #3498db; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .size-tag { display: inline-block; background: #ebf5fb; color: #2980b9; padding: 4px 8px; border-radius: 4px; font-size: 11px; margin: 2px; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">👕 Euro Style Katalog</h2>
    <div id="catalog"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // NGROK LINKINGIZ (Rasmga asosan yangilandi)
        const SERVER_URL = "https://undepicted-rosina-deferential.ngrok-free.dev";

        async function load() {
            const list = document.getElementById('catalog');
            try {
                const res = await fetch(`${SERVER_URL}/api/products`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                const products = await res.json();
                list.innerHTML = "";

                if (products.length === 0) {
                    list.innerHTML = "<p style='text-align:center;'>Hozircha mahsulot yo'q.</p>";
                    return;
                }

                products.forEach(p => {
                    const sizes = p.sizes ? p.sizes.split(',').map(s => `<span class="size-tag">${s.trim()}</span>`).join('') : '';
                    list.innerHTML += `
                        <div class="product-card">
                            <img src="${p.img}">
                            <h3>${p.name}</h3>
                            <div>${sizes}</div>
                            <p class="price">${p.price} so'm</p>
                            <button class="buy-btn" onclick="tg.sendData('${p.name}')">Sotib olish</button>
                        </div>`;
                });
            } catch (e) {
                list.innerHTML = "<p style='text-align:center; color:red;'>⚠️ Serverga ulanib bo'lmadi. Iltimos, qayta urinib ko'ring.</p>";
            }
        }
        window.onload = load;
    </script>
</body>
</html>
