<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        .product-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: white; border-radius: 10px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
        .price { color: #007bff; font-weight: bold; margin: 10px 0; }
        .btn { width: 100%; background: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .size { font-size: 11px; background: #eef; padding: 2px 5px; border-radius: 3px; margin: 2px; display: inline-block; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">👔 Euro Style Katalog</h2>
    <div id="catalog" class="product-list">
        <p style="text-align:center; grid-column: 1/3;">Yuklanmoqda...</p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const SERVER_URL = "https://undepicted-rosina-deferential.ngrok-free.dev";

        async function loadProducts() {
            const catalog = document.getElementById('catalog');
            try {
                const response = await fetch(`${SERVER_URL}/api/products`, {
                    headers: {
                        "ngrok-skip-browser-warning": "true" // OGOHLANTIRISHNI CHETLAB O'TISH
                    }
                });

                const products = await response.json();
                catalog.innerHTML = "";

                if (products.length === 0) {
                    catalog.innerHTML = "<p style='grid-column:1/3; text-align:center;'>Hozircha mahsulot yo'q.</p>";
                    return;
                }

                products.forEach(p => {
                    const sizes = p.sizes ? p.sizes.split(',').map(s => `<span class="size">${s.trim()}</span>`).join('') : '';
                    catalog.innerHTML += `
                        <div class="card">
                            <img src="${p.img}">
                            <h4 style="margin:5px 0;">${p.name}</h4>
                            <div>${sizes}</div>
                            <div class="price">${p.price} so'm</div>
                            <button class="btn" onclick="tg.sendData('${p.name}')">Sotib olish</button>
                        </div>`;
                });
            } catch (error) {
                catalog.innerHTML = "<div style='grid-column:1/3; text-align:center; color:red;'>⚠️ Server bilan aloqa yo'q.<br>Reload tugmasini bosing.</div>";
            }
        }
        window.onload = loadProducts;
    </script>
</body>
</html>
