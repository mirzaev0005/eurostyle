<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style Katalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; padding: 20px; }
        .product-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; border-radius: 10px; max-height: 200px; object-fit: cover; }
        .btn { background: #0088cc; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🛍 Euro Style Katalog</h2>
    <div id="product-list"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const products = [
            { id: 1, name: "Mahalliy Klassik Ko'ylak", price: "180,000", img: "https://your-image-link.com/koylak1.jpg" },
            { id: 2, name: "Chet el Premium Futbolka", price: "150,000", img: "https://your-image-link.com/futbolka1.jpg" },
            { id: 3, name: "Erkaklar Kamari (Charm)", price: "95,000", img: "https://your-image-link.com/kamar.jpg" }
        ];

        const list = document.getElementById('product-list');
        products.forEach(p => {
            list.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p>Narxi: ${p.price} so'm</p>
                    <button class="btn" onclick="order('${p.name}')">Sotib olish</button>
                </div>
            `;
        });

        function order(name) {
            tg.sendData("Buyurtma: " + name);
            tg.close();
        }
    </script>
</body>
</html>
