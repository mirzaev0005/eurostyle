<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; padding: 15px; margin: 0; }
        .product-card { background: #fff; border-radius: 15px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; border-radius: 10px; height: 220px; object-fit: cover; }
        .size-tag { display: inline-block; background: #e9ecef; padding: 5px 10px; margin: 3px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .price { color: #007bff; font-size: 20px; font-weight: bold; margin: 10px 0; }
        .btn { width: 100%; background: #007bff; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">👔 Euro Style Katalog</h2>
    <div id="product-list"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // SIZNING NGROK LINKINGIZ (Rasmga asosan)
        const SERVER_URL = "https://undepicted-rosina-deferential.ngrok-free.dev"; 

        async function loadProducts() {
            const list = document.getElementById('product-list');
            try {
                const res = await fetch(`${SERVER_URL}/api/products`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                const products = await res.json();
                list.innerHTML = "";

                if (products.length === 0) {
                    list.innerHTML = "<p style='text-align:center;'>Hozircha mahsulot yo'q. Admin paneldan qo'shing.</p>";
                    return;
                }

                products.forEach(p => {
                    const sizes = p.sizes ? p.sizes.split(',').map(s => `<span class="size-tag">${s.trim()}</span>`).join('') : '';
                    list.innerHTML += `
                        <div class="product-card">
                            <img src="${p.img}">
                            <h3>${p.name}</h3>
                            <div>${sizes}</div>
                            <p class="price">${p.price} so'm</p>
                            <button class="btn" onclick="tg.sendData('${p.name} - ${p.price}')">Sotib olish</button>
                        </div>`;
                });
            } catch (e) {
                list.innerHTML = "<p style='text-align:center; color:red;'>⚠️ Serverga ulanib bo'lmadi.</p>";
            }
        }
        window.onload = loadProducts;
    </script>
</body>
</html>
