<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 10px; margin: 0; }
        .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; border-radius: 8px; height: 200px; object-fit: cover; }
        .tag { display: inline-block; background: #e7efff; color: #007aff; padding: 2px 8px; margin: 2px; border-radius: 4px; font-size: 11px; }
        .price { color: #007aff; font-size: 18px; font-weight: bold; margin: 10px 0; }
        .btn { width: 100%; background: #007aff; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">👔 Euro Style Katalog</h2>
    <div id="list"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // DIQQAT: SHU YERGA NGROK LINKINI QO'YING
        const SERVER_URL = "https://SIZNING-NGROK-LINKINGIZ.ngrok-free.app"; 

        async function load() {
            const container = document.getElementById('list');
            try {
                const res = await fetch(`${SERVER_URL}/api/products`);
                const products = await res.json();
                container.innerHTML = "";

                products.forEach(p => {
                    const sizes = p.sizes ? p.sizes.split(',').map(s => `<span class="tag">${s.trim()}</span>`).join('') : '';
                    container.innerHTML += `
                        <div class="card">
                            <img src="${p.img}">
                            <h3>${p.name}</h3>
                            <div>${sizes}</div>
                            <p class="price">${p.price} so'm</p>
                            <button class="btn" onclick="tg.sendData('${p.name} (${p.price})')">Sotib olish</button>
                        </div>
                    `;
                });
            } catch (e) { container.innerHTML = "<p style='color:red; text-align:center;'>⚠️ Serverga ulanib bo'lmadi.</p>"; }
        }
        window.onload = load;
    </script>
</body>
</html>
