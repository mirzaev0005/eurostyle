<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style Katalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f0f; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background-color: #d4af37; color: #000; padding: 20px 0; text-align: center; font-size: 24px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .container { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 500px; }
        .card { background: #1e1e1e; border: 1px solid #d4af37; border-radius: 15px; overflow: hidden; text-align: center; transition: 0.3s; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card h3 { font-size: 16px; margin: 10px 0; color: #d4af37; }
        .price { font-size: 14px; color: #bbb; margin-bottom: 10px; display: block; }
        button { background: #d4af37; color: #000; border: none; padding: 10px; width: 90%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <header>EURO STYLE 👔</header>
    <div class="container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=400" alt="Polo">
            <h3>Demiks Polo</h3>
            <span class="price">120 000 so'm</span>
            <button onclick="order('Demiks Polo')">Tanlash</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400" alt="Shirt">
            <h3>Oq Ko'ylak</h3>
            <span class="price">155 000 so'm</span>
            <button onclick="order('Oq Ko\'ylak')">Tanlash</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function order(product) {
            tg.sendData(product);
            tg.close();
        }
    </script>
</body>
</html>
