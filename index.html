<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style Katalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 0; }
        header { width: 100%; background: linear-gradient(135deg, #d4af37, #f2d06b); color: #000; padding: 15px 0; text-align: center; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #111; border: 1px solid #222; border-radius: 12px; overflow: hidden; text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-info { padding: 10px; }
        .price { color: #d4af37; font-weight: bold; font-size: 16px; display: block; margin-bottom: 8px; }
        .btn { background: #d4af37; color: #000; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <header>EURO STYLE</header>
    <div class="container">
        <div class="card">
            <img src="923.jpg">
            <div class="card-info">
                <h3>Demiks Polo</h3>
                <span class="price">120 000 so'm</span>
                <button class="btn" onclick="sendOrder('Demiks Polo (923) - 120,000 sum')">Tanlash</button>
            </div>
        </div>
        <div class="card">
            <img src="925.jpg">
            <div class="card-info">
                <h3>Demiks Polo</h3>
                <span class="price">120 000 so'm</span>
                <button class="btn" onclick="sendOrder('Demiks Polo (925) - 120,000 sum')">Tanlash</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function sendOrder(item) {
            // BU FUNKSIYA MA'LUMOTNI BOTGA YUBORADI
            tg.sendData(item);
        }
    </script>
</body>
</html>
