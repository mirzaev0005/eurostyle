<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 10px; margin: 0; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card img { width: 100%; border-radius: 10px; height: 200px; object-fit: cover; }
        .price { color: #007bff; font-weight: bold; font-size: 20px; margin: 10px 0; }
        .btn { width: 100%; background: #007bff; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .size { display: inline-block; background: #eef2ff; color: #4f46e5; padding: 5px 10px; border-radius: 5px; font-size: 12px; margin-right: 5px; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">👔 Euro Style Katalog</h2>
    <div id="catalog"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // NGROK LINKINGIZ (Aynan sizning rasmga asosan)
        const SERVER_URL = "https://undepicted-rosina-deferential.ngrok-free.dev";

        async function load() {
            const list = document.getElementById('catalog');
            try {
                // Ngrok ogohlantirishini chetlab o'tish uchun header qo'shildi
                const res = await fetch(`${SERVER_URL}/api/products`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                const products = await res.json();
                list.innerHTML = "";

                if (products.length === 0) {
                    list.innerHTML = "<p style='text-align:center;'>Hozircha mahsulotlar yo'q.</p>";
                    return;
                }

                products.forEach(p => {
                    const sizes = p.sizes ? p.sizes.split(',').map(s => `<span class="size">${s.trim()}</span>`).join('') : '';
                    list.innerHTML += `
                        <div class="card">
                            <img src="${p.img}">
                            <h3>${p.name}</h3>
                            <div style="margin-bottom:10px;">${sizes}</div>
                            <p class="price">${p.price} so'm</p>
                            <button class="btn" onclick="tg.sendData('${p.name} - ${p.price}')">Buyurtma berish</button>
                        </div>`;
                });
            } catch (e) {
                list.innerHTML = "<p style='color:red; text-align:center;'>⚠️ Serverga ulanishda xato. Iltimos, qayta yangilang (Reload).</p>";
            }
        }
        window.onload = load;
    </script>
</body>
</html>
